components:
  schemas:
    UserSubscriptionResponse:
      description: Describes a list of user subscriptions
      required:
      - _embedded
      properties:
        _embedded:
          $ref: '#/components/schemas/UserSubscriptions'
    ActivationState:
      type: string
      description: Final state of user subscription. ActivationState will be ACTIVE if both webhook and user subscription states are ACTIVE, INACTIVE otherwise.
      enum:
      - INACTIVE
      - ACTIVE
    UserSubscriptionState:
      type: string
      description: State of the user subscription
      enum:
      - INACTIVE
      - ACTIVE
    SecretKeyRequest:
      description: Representation of a secret key
      properties:
        validFrom:
          description: A date time in ISO8601 format, e.g. 2019-07-01T22:00:00Z. The secret key will be activated at the given date
          type: string
    UpdateUserSubscriptionsRequest:
      description: Describes a single user subscription update request
      required:
      - webhookKey
      - userSubscriptionKey
      properties:
        callbackUrl:
          type: string
          description: A HTTPs url that can accept posted events. It should return 200 OK for GET requests.
        webhookKey:
          type: string
          description: The unique identifier for the webhook
        userSubscriptionKey:
          type: string
          description: The unique identifier for the user subscription
        userSubscriptionState:
          $ref: '#/components/schemas/UserSubscriptionState'
    UpdateWebhooksRequest:
      description: Describes a single webhook update request
      required:
      - webhookKey
      properties:
        callbackUrl:
          type: string
          description: A HTTPs url that can accept posted events. It should return 200 OK for GET requests.
        webhookKey:
          type: string
          description: The unique identifier for the webhook
        state:
          $ref: '#/components/schemas/WebhookState'
    CreateUserSubscriptionRequest:
      description: Describes a single user subscription
      required:
      - webhookKey
      properties:
        callbackUrl:
          type: string
          description: A HTTPs url that can accept posted events. It should return 200 OK for GET requests.
        webhookKey:
          type: string
          description: The unique identifier for the webhook
        userSubscriptionState:
          $ref: '#/components/schemas/UserSubscriptionState'
    Webhooks:
      description: ''
      required:
      - webhooks
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
    UserSubscription:
      description: Describes a single user subscription
      properties:
        callbackUrl:
          type: string
          description: A HTTPs url that can accept posted events. It should return 200 OK for GET requests.
        eventName:
          type: string
          description: Type of event of the webhook
        eventVersion:
          type: string
          description: Version of event being subscribed for
        product:
          $ref: '#/components/schemas/Product'
        webhookKey:
          type: string
          description: The unique identifier for the webhook
        userSubscriptionKey:
          type: string
          description: The unique identifier for the user subscription
        userSubscriptionState:
          $ref: '#/components/schemas/UserSubscriptionState'
        activationState:
          $ref: '#/components/schemas/ActivationState'
        createTime:
          type: string
          description: The create time of the webhook
    Product:
      type: string
      description: Product of the events
      enum:
      - g2w
    SecretKeyResponse:
      description: Representation of a secret key
      properties:
        id:
          description: The unique identifier for the secret key
          type: integer
        value:
          description: The value of the secret key. This is used for generating a signature of events posted to the callback url
          type: string
        validFrom:
          description: A date time in ISO8601 format, e.g. 2019-07-01T22:00:00Z. The secret key will be activated at the given date
          type: string
    CreateWebhookRequest:
      description: Representation of a single webhook
      required:
      - callbackUrl
      - eventName
      - eventVersion
      - product
      properties:
        callbackUrl:
          type: string
          description: A HTTPs url that can accept posted events. It should return 200 OK for GET requests.
        eventName:
          type: string
          description: Type of event for the webhook. Supported eventNames are registrant.added, registrant.joined, webinar.created, webinar.changed, survey.submitted
        eventVersion:
          type: string
          description: Version of event being subscribed for. Supported eventVersion is 1.0.0
        product:
          $ref: '#/components/schemas/Product'
    WebhooksResponse:
      description: List of webhooks
      required:
      - _embedded
      properties:
        _embedded:
          $ref: '#/components/schemas/Webhooks'
    UserSubscriptions:
      description: ''
      required:
      - userSubscriptions
      properties:
        userSubscriptions:
          type: array
          items:
            $ref: '#/components/schemas/UserSubscription'
    Webhook:
      description: Representation of a single webhook
      required:
      - callbackUrl
      - eventName
      - eventVersion
      - product
      properties:
        callbackUrl:
          type: string
          description: A HTTPs url that can accept posted events. It should return 200 OK for GET requests.
        eventName:
          type: string
          description: Type of event for the webhook. Supported eventNames are registrant.added, registrant.joined, webinar.created, webinar.changed, survey.submitted
        eventVersion:
          type: string
          description: Version of event being subscribed for. Supported eventVersion is 1.0.0
        product:
          $ref: '#/components/schemas/Product'
        webhookKey:
          type: string
          description: The unique identifier for the webhook
        state:
          $ref: '#/components/schemas/WebhookState'
        createTime:
          type: string
          description: The create time of the webhook
    WebhookState:
      type: string
      description: State of the webhook
      enum:
      - INACTIVE
      - ACTIVE
  parameters:
    userSubscriptionsKey:
      name: userSubscriptionsKey
      in: path
      description: The unique identifier for a user subscription.
      required: true
      schema:
        type: string
    product:
      name: product
      in: query
      description: Supported products
      required: true
      schema:
        type: string
        enum:
        - g2w
    webhookKey:
      name: webhookKey
      in: path
      description: The unique identifier for a webhook.
      required: true
      schema:
        type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: 'To use this API, you _must_ provide an OAuth Token that has been requested from LogMeIn OAuth Authorization Server. See https://goto-developer.logmeininc.com/how-get-access-token-and-organizer-key for documentation about how to use LogMeIn’s OAuth.

        '
      in: header
      name: Authorization
      scheme: Bearer
      flows:
        password:
          tokenUrl: https://authentication.logmeininc.com/oauth/token
          refreshUrl: https://authentication.logmeininc.com/oauth/token
        authorizationCode:
          authorizationUrl: https://authentication.logmeininc.com/oauth/authorize
          tokenUrl: https://authentication.logmeininc.com/oauth/token
          refreshUrl: https://authentication.logmeininc.com/oauth/token
