        '
      example: '2020-03-13T22:00:00Z'
      required: true
      schema:
        type: string
        format: date-time
    page:
      name: page
      in: query
      required: false
      description: The page number to be displayed. The first page is 0.
      schema:
        type: integer
        format: int64
    size:
      name: size
      in: query
      required: false
      description: The size of the page.
      schema:
        type: integer
        format: int64
        maximum: 200
    limit:
      name: limit
      in: query
      required: false
      description: The size of the page.
      schema:
        type: integer
        format: int64
        maximum: 200
    requiredToTime:
      name: toTime
      in: query
      description: 'End of the datetime range in ISO8601 UTC format. The reserved characters like ''+'' have to be encoded while being passed as query parameter.

        '
      example: '2020-03-13T22:00:00Z'
      required: true
      schema:
        type: string
        format: date-time
    organizerKey:
