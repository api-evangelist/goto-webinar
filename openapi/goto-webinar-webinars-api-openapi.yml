    CopyWebinar:
      description: Describes the details of the webinar to be copied
      properties:
        subject:
          type: string
          description: The name/subject of the webinar (128 characters maximum)
        description:
          type: string
          description: A description of the webinar (2048 characters maximum)
        type:
          description: "Specifies the webinar type. The default type value is 'single_session', which is used to create a single webinar session. The possible values are 'single_session', 'series' and 'sequence'. If type is set to 'single_session', a single webinar session is created. If type is set to 'series', a webinar series is created. In this case 2 or more timeframes must be specified for each webinar. Example: 'times': [{'startTime': '...', 'endTime':'...'}, {'startTime': '...', 'endTime': '...'},{'startTime': '...','endTime': '...'}]. If type is set to 'sequence', a sequence of webinars is created. In this case 2 or more timeframes must be specified for each webinar. If given webinar is 'single_session', we can create 'sequence' or 'series'\n webinar, in this case 2 or more timeframes must be specified for each webinar\n(same example as above). If given webinar is 'series', we can create 'single_session' or 'sequence' webinar with 2 or more timeframes must be specified. If given webinar is simulive webinar 'sequence' type is not supported.\n"
          type: string
          default: single_session
        recordingAssetKey:
          type: string
          description: The recording asset with from the simulive webinar should be created from. In case the recordingasset was created as an online recording the simulive webinar settings, poll and surveys would be copied from the webinar whose session was recorded. We can get recordingasset from [RecordingAssets](GoToWebinarV2#operation/searchAssets)
        isOndemand:
          type: boolean
          default: false
          description: A boolean flag indicating if the webinar should be ondemand
        locale:
          type: string
          enum:
          - en_US
          - de_DE
          - es_ES
          - fr_FR
          - it_IT
          - zh_CN
          description: The webinar language
        emailSettings:
          $ref: '#/components/schemas/WebinarEmailSettings'
        times:
          description: Array with start and end time(s) for webinar
          type: array
          items:
            $ref: '#/components/schemas/DateTimeRange'
        timeZone:
          type: string
          description: The time zone where the webinar is taking place (must be a valid time zone ID). If this parameter is not passed, the timezone of the organizer's profile will be used
