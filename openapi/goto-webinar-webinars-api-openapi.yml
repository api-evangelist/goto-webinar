        '
      required: false
      example: '2020-03-13T10:00:00Z'
      schema:
        type: string
        format: date-time
    requiredFromTime:
      name: fromTime
      in: query
      description: 'Start of the datetime range in ISO8601 UTC format. The reserved characters like ''+'' have to be encoded while being passed as query parameter.

        '
      required: true
      example: '2020-03-13T10:00:00Z'
      schema:
        type: string
        format: date-time
  schemas:
    AttendeeFollowUpEmailSetting:
      description: Describes Attendee follow-up email settings.
      allOf:
      - $ref: '#/components/schemas/EmailSettings'
      - type: object
        properties:
          includeCertificate:
            type: boolean
            description: Indicates whether to include certificates in attendee follow-up emails is enabled or disabled.
    WebinarReqCreate:
      description: Describes the details used to create a new single session webinar.
      required:
      - subject
      - times
      properties:
        subject:
          type: string
          description: The name/subject of the webinar (128 characters maximum)
        description:
          type: string
          description: A short description of the webinar (2048 characters maximum)
        times:
          description: 'Array with startTime and endTime for webinar. Since this call creates single session webinars, the array can only contain a single pair of startTime and endTime

            '
          type: array
          items:
            $ref: '#/components/schemas/DateTimeRange'
        timeZone:
          type: string
          description: 'The time zone where the webinar is taking place (must be a valid time zone ID). If this parameter is not passed, the timezone of the organizer''s profile will be used

            '
        type:
          description: 'Specifies the webinar type. The default type value is ''single_session'', which is used to create a single webinar session. The possible values are ''single_session'', ''series'', ''sequence''. If type is set to ''single_session'', a single webinar session is created. If type is set to ''series'', a webinar series is created. In this case 2 or more timeframes must be specified for each webinar. Example: ''times'': [{''startTime'': ''...'', ''endTime'': ''...''},{''startTime'': ''...'', ''endTime'': ''...''},{''startTime'': ''...'', ''endTime'': ''...''}. If type is set to ''sequence'' a sequence of webinars is created. The times object in the body must be replaced by the ''recurrenceStart'' object. Example: ''recurrenceStart'': {''startTime'':''2012-06-12T16:00:00Z'', ''endTime'': ''2012-06-12T17:00:00Z'' }.  The ''recurrenceEnd'' and ''recurrencePattern'' body parameter must be specified. Example: , ''recurrenceEnd'': ''2012-07-10'', ''recurrencePattern'': ''daily''.

            '
          type: string
          default: single_session
        locale:
          type: string
          enum:
          - en_US
          - de_DE
          - es_ES
          - fr_FR
          - it_IT
          - zh_CN
          description: The webinar language
        isPasswordProtected:
          type: boolean
          default: false
          description: A boolean flag indicating if the webinar is password protected or not.
        recordingAssetKey:
          type: string
          description: The recording asset with which the simulive webinar should be created from. In case the recordingasset was created as an online recording the simulive webinar settings, poll and surveys would be copied from the webinar whose session was recorded.
        isOndemand:
          type: boolean
          default: false
          description: A boolean flag indicating if the webinar should be ondemand
        isBreakout:
          type: boolean
          default: false
          description: A boolean flag indicating if the webinar should be breakout
        experienceType:
          description: Specifies the experience type. The possible values are 'CLASSIC', 'BROADCAST' and 'SIMULIVE'.
          default: CLASSIC
          type: string
        emailSettings:
          $ref: '#/components/schemas/WebinarEmailSettings'
    AudioType:
      description: How to connect to the webinar's audio conference
      type: string
      enum:
      - PSTN
      - VOIP
      - Hybrid
      - Private
    WebinarStartUrlResponse:
      description: Describes a webinar start url
      required:
      - startUrl
      properties:
        startUrl:
          type: string
          description: The URL that can be used to start a webinar
    WebinarEmailSettings:
      description: Describes email settings of a webinar.
      properties:
        confirmationEmail:
          $ref: '#/components/schemas/EmailSettings'
        reminderEmail:
          $ref: '#/components/schemas/EmailSettings'
        absenteeFollowUpEmail:
          $ref: '#/components/schemas/EmailSettings'
        attendeeFollowUpEmail:
          $ref: '#/components/schemas/AttendeeFollowUpEmailSetting'
    RecordingAssetsResponse:
