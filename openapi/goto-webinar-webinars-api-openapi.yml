      in: path
      description: The key of the account
      required: true
      schema:
        type: integer
        format: int64
    sourceWebinarKey:
      name: webinarKey
      in: path
      description: The key of source webinar
      required: true
      schema:
        type: integer
        format: int64
    webinarKey:
      name: webinarKey
      in: path
      description: The key of the webinar
      required: true
      schema:
        type: integer
        format: int64
    optionalFromTime:
      name: fromTime
      in: query
