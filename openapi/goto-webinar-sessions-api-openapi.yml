components:
  schemas:
    Attendee:
      description: Describes the attendee of a webinar
      required:
      - registrantKey
      - firstName
      - lastName
      - email
      - attendanceTimeInSeconds
      - attendance
      - sessionKey
      properties:
        registrantKey:
          type: integer
          format: int64
          description: The key of the webinar attendee
        firstName:
          type: string
          description: The attendee's first name
        lastName:
          type: string
          description: The attendee's last name
        email:
          type: string
          description: The attendee's email address
        attendanceTimeInSeconds:
          type: integer
          format: int64
          description: The total attendance time in seconds
        sessionKey:
          type: integer
          format: int64
          description: The unique key of the webinar session
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'
          description: The list of times the attendee joined and left the webinar session
    AnswerToAttendeeQuestion:
      description: Describes an answer to a question asked by an attendee during a webinar session.
      required:
      - answer
      - answeredBy
      - answererRole
      - answerTime
      - answererEmail
      properties:
        answer:
          type: string
          description: An answer given to a question asked by an attendee during a webinar session
        answeredBy:
          type: string
          description: The key of the organizer that answered the attendee's question
        answererRole:
          type: string
          description: The role of the answerer
        answerTime:
          type: string
          description: The key of the organizer that answered the attendee's question
        answererEmail:
          type: string
          description: The answerer's email address
    SessionInfoStatistics:
      description: Describes session details for webinar session
      required:
      - webinarName
      - webinarId
      - sessionKey
      - timeZone
      - experienceType
      - recurrencePeriod
      - startTime
      - endTime
      - registrationEmailOpenedCount
      - registrationLinkClickedCount
      properties:
        webinarName:
          type: string
          description: Name of the webinar
        webinarId:
          type: string
          description: The 9-digit webinar ID
        sessionKey:
          type: string
          description: The key of the webinar session
        timeZone:
          type: string
          description: The time zone where the webinar will take place
        experienceType:
          description: Specifies the webinar experience type.
          type: string
          enum:
          - CLASSIC
          - BROADCAST
          - SIMULIVE
        recurrencePeriod:
          type: string
        startTime:
          type: string
          format: date-time
          description: The starting time of an interval, e.g. 2020-03-13T10:00:00Z
        endTime:
          type: string
          format: date-time
          description: The ending time of an interval, e.g. 2020-03-13T22:00:00Z
        registrationEmailOpenedCount:
          type: string
          description: The count of opened registration emails
        registrationLinkClickedCount:
          type: string
          description: The count of registration links clicked
    PollResponse:
      description: One of the potential responses/options to a poll or survey launched by an organizer during a webinar session.
      required:
      - text
      - percentage
      properties:
        text:
          type: string
          description: The text of the response/option to a poll or survey
        percentage:
          type: number
          format: float
          description: The percentage of responses that favored this particular option
          maximum: 100
          minimum: 0
    SessionPerformance:
      description: Describes performance details for webinar sessions
      required:
      - sessionInfo
      - attendance
      - pollsAndSurveys
      properties:
        sessionInfo:
          $ref: '#/components/schemas/SessionInfoStatistics'
        attendance:
          $ref: '#/components/schemas/AttendanceStatistics'
        pollsAndSurveys:
          $ref: '#/components/schemas/PollsAndSurveysStatistics'
    AttendeeQuestion:
      description: Describes the question asked by an attendee during a webinar session; includes the answers given to it.
      required:
      - answers
      - question
      - askedBy
      - askerKey
      - dateAsked
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerToAttendeeQuestion'
          description: Answer to a question of an attendee and key of the organizer that answered
        question:
          type: string
          description: The question asked by the attendee
        askedBy:
          type: string
          description: The email address of the attendee that asked the question
        askerKey:
          type: string
          description: The key of the attendee who asked the question
        dateAsked:
          type: string
          format: date-time
          description: The date on which the question was asked e.g. 2020-03-13T10:00:00Z
    Poll:
      description: A poll or survey launched by an organizer during or after a webinar session; includes the responses given to it by the attendees.
      required:
      - responses
      - question
      - numberOfResponses
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/PollResponse'
          description: The responses given by the attendees to the poll or survey
        question:
          type: string
          description: The poll or survey question asked by the webinar organizer
        numberOfResponses:
          type: integer
          format: int32
          description: The total number of responses received for this poll or survey
    ReportingSession:
      description: Describes a completed webinar session.
      required:
      - sessionKey
      - webinarKey
      - webinarName
      - startTime
      - endTime
      - registrantsAttended
      - registrantCount
      - accountKey
      - creatingOrganizerKey
      - creatingOrganizerName
      - startingOrganizerKey
      - startingOrganizerName
      - totalPollCount
      - timeZone
      - experienceType
      - webinarID
      properties:
        sessionKey:
          type: string
          description: The unique key of the webinar session
        webinarKey:
          type: string
          description: The unique key of the webinar
        webinarName:
          type: string
          description: The webinar name
        startTime:
          type: string
          format: date-time
          description: The starting time of the webinar session
        endTime:
          type: string
          format: date-time
          description: The ending time of the webinar session
        registrantsAttended:
          type: integer
          format: int32
          description: The number of registrants who attended the webinar session
        registrantCount:
          type: integer
          format: int32
          description: The total number of registrants for the webinar
        accountKey:
          type: string
          description: The key of the account
        creatingOrganizerKey:
          type: string
          description: The key of the webinar organizer who scheduled the webinar
        creatingOrganizerName:
          type: string
          description: The name of the webinar organizer who scheduled the webinar
        startingOrganizerKey:
          type: string
          description: The key of the webinar organizer who started the webinar session
        startingOrganizerName:
          type: string
          description: The name of the webinar organizer who started the webinar session
        totalPollCount:
          type: integer
          format: int32
          description: The total number of polls for the webinar session
        timeZone:
          type: string
          description: The timezone where the webinar is taking place
        experienceType:
          description: Specifies the experience type. The possible values are 'classic', 'broadcast' and 'simulive'.
          type: string
        webinarID:
          type: string
          description: The 9-digit webinar ID
        webinarType:
          type: integer
          format: int32
          description: The webinar type
        numRegLinkClicks:
          type: integer
          format: int32
          description: The number of registration link clicks
        numOpenedInvitations:
          type: integer
          format: int32
          description: The number of opened invitations
        includeCertificate:
          type: boolean
          description: Indicates whether to include certificate is enabled or disabled
        followupEmailTriggered:
          type: boolean
          description: Indicates whether to trigger followup email is enabled or disabled
    PollsAndSurveysStatistics:
      description: Details on the polls and surveys for a webinar session.
      required:
      - pollCount
      - surveyCount
      - questionsAsked
      - percentagePollsCompleted
      - percentageSurveysCompleted
      properties:
        pollCount:
          type: integer
          format: int32
          description: The number of polls launched at a webinar session
        surveyCount:
          type: number
          format: float
          description: The percentage of surveys launched at a webinar session
        questionsAsked:
          type: integer
          format: int32
          description: The number of questions asked at a webinar session
        percentagePollsCompleted:
          type: number
          format: float
          description: The percentage of polls completed by the attendees
        percentageSurveysCompleted:
          type: number
          format: float
          description: The percentage of surveys completed by the attendees
    ReportingSessionsResponse:
      description: Describes a list of webinar sessions
      required:
      - _embedded
      - page
      properties:
        _embedded:
          $ref: '#/components/schemas/ReportingSessions'
        page:
          $ref: '#/components/schemas/page'
    ReportingSessions:
      description: ''
      required:
      - sessionInfoResources
      properties:
        sessionInfoResources:
          type: array
          items:
            $ref: '#/components/schemas/ReportingSession'
    AttendanceStatistics:
      description: Describes attendance metrics for a webinar session.
      required:
      - registrantCount
      - percentageAttendance
      - averageInterestRating
      - averageAttentiveness
      - averageAttendanceTimeSeconds
      properties:
        registrantCount:
          type: integer
          format: int32
          description: The number of registrations for the webinar
        percentageAttendance:
          type: number
          format: float
          description: The percentage of registrants that actually attended the webinar session
        averageInterestRating:
          type: number
          format: float
          description: Numerical value 1-100 (100 being most interested) indicating the average interest rating of the webinar attendees
        averageAttentiveness:
          type: number
          format: float
          description: Average based on the focus of the attendees Viewer during the webinar session
        averageAttendanceTimeSeconds:
          type: number
          format: float
          description: Average attendance time in seconds
    page:
      required:
      - size
      - totalElements
      - totalPages
      - number
