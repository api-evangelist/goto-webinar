  name: GoTo Webinar REST API v2
  description: >-
    REST API for managing organizers, webinars, sessions, registrants, attendees, panelists, polls, surveys,
    and recordings on the GoTo Webinar platform. Authentication uses OAuth 2.0 via the GoTo identity service,
    with authorization at api.getgo.com/oauth/v2/authorize and token exchange at api.getgo.com/oauth/v2/token.
