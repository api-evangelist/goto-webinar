note: >-
  GoTo publishes first-party SDKs for GoTo Webinar in exactly two ecosystems —
  Java (Maven Central, group com.logmein) and .NET (NuGet, LogMeIn.*). The SDK
  introduction page states SDKs are provided "in source and binary formats for
  the GoToMeeting, GoToWebinar and GoToTraining REST APIs for .NET and Java"
  and that "SDKs for the other GoTo products will follow". There is no
  first-party JavaScript/TypeScript, Python, Ruby, PHP, Go or Rust client —
  npm/PyPI/RubyGems probes for `gotowebinar` all returned 404 and every
  npm/GitHub result is third-party (Pipedream, DataFire, n8n, community
  wrappers). Currency is the headline finding: the newest first-party GoTo
  Webinar SDK release on any registry is 2022-06-01, four years before this
  probe, while the REST API itself shipped changes as recently as 2026-06-09.
  The shared .NET core library (LogMeIn.GoToCoreLib.NET) is explicitly marked
  deprecated in GoTo's own .NET SDK guide.
