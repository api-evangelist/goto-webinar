notes:
- >-
  The model has no soft-delete or archive concept. cancelWebinar removes the
  webinar (with a deleteAll flag for series control) and deleteRegistrant
  removes the registrant outright.
- >-
  Reporting responses (ReportingWebinars, ReportingSessions, ReportingAttendees)
  are separate schemas from the primary resources with overlapping but not
  identical field sets — the same entity has two shapes depending on which
  collection returned it.
