  key_convention: >-
    Every identifier in this API is a `<entity>Key`. Keys are numeric (int64)
    except webhookKey and userSubscriptionKey, which are opaque strings. There
    are no prefixed or self-describing ids, so a bare key value carries no type
    information — an agent must track which key belongs to which entity from
    context alone.
  identity_gotcha: >-
    GoTo's own reference states "Both userKey and organizerKey used in the APIs
    contain the same value". The two names refer to one identity; treating them
    as separate lookups is a common integration error.
