deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    GoTo publishes NO deprecation policy for the GoTo Webinar API. There is no
    policy page, no notice period, no RFC 8594 Sunset/Deprecation header
    support, and no `deprecated: true` flag on any of the 53 operations in the
    GoToWebinarV2 OpenAPI. Deprecations are announced only as prose entries in
    the shared Developer Center changelog after the fact — e.g. the GoToConnect
    entries "New callOutcome Field in Queue Caller Details (outcome Deprecated)"
    (2026-05-04) and "Deprecated inSLA Field Removed from Queue Caller Details"
    (2026-04-14), which show fields being deprecated and then removed with no
    machine-readable signal on either end. No Deprecation pointer is emitted in
    apis.yml, because there is no deprecation policy to point at.
deprecated_operations: []
deprecated_features:
- feature: Direct Login (OAuth password grant)
  status: deprecated
  source: https://developer.goto.com/guides/References/05_Direct-Login_migration/
  evidence: >-
    "This authentication API is now deprecated. All new clients will not be able
    to use this API. If you have a client for which the direct login works, that
    will continue to work for now." — GoTo Java/.NET SDK guides. The `password`
    flow is nevertheless still declared in the live GoToWebinarV2 OpenAPI
    securityScheme, so the contract advertises a flow the docs disallow for new
    clients.
- feature: LogMeIn.GoToCoreLib.NET
  status: deprecated
  source: https://developer.goto.com/guides/SDKs/03_NET-SDK/
  evidence: >-
    "DEPRECATION NOTE — The GoToCoreLib SDK is deprecated and will no longer be
    supported. The current version is the last version for now." It remains the
    documented dependency of the GoTo Webinar .NET SDK.
- feature: authentication.logmeininc.com token retrieval
  status: migrating
  source: https://developer.goto.com/guides/Authentication/New_Token_Retrieval_Migration_Guide/
  evidence: >-
    GoTo publishes a "Migrating to New Token Retrieval with
    authentication.logmeininc.com" guide. The RFC 8414 metadata served at that
    host reports issuer https://identity.goto.com, so the identity surface is
    mid-rename while the OpenAPI still names the legacy host.
